[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isabelle-block"
version = "0.1.1"
description = "Mechanical block surgery on Isabelle theory sources: move, copy, delete, rewrite and substitute inside regions named by line span or by entry name."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "András Salamon", email = "Andras.Salamon@st-andrews.ac.uk" },
]
keywords = [
    "isabelle", "isar", "theorem-proving", "formal-verification",
    "afp", "refactoring",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development",
]
dependencies = [
    # 1.1.0: an entry no longer ends at a heading inside its own proof
    # [early-end], so a cut_span written through holds the whole proof.
    "isabelle-query>=1.1.0",
    # default_t_dir, the session-root discovery `query` itself uses.
    "isabelle-layout>=0.2.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ott2/isabelle-block"
Source = "https://github.com/ott2/isabelle-block"

[project.scripts]
block = "isabelle_block.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The corpus tests read real trees and take about a minute: `pytest -m corpus`.
addopts = "-ra --strict-markers -m 'not corpus'"
markers = ["corpus: read-only checks against NDTHT's t/ and the AFP"]

[tool.hatch.build.targets.wheel]
packages = ["src/isabelle_block"]

[tool.hatch.build.targets.sdist]
# Anchored with a leading `/`: an unanchored "README.md" matches at any depth,
# and shipped docs/prior-art/README.md and upstream/README.md.
include = ["/src", "/tests", "/README.md", "/LICENSE"]
